name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A new push to a pull request cancels its outdated run. Runs on main are
# never canceled, so every merge is verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A disposable PostgreSQL and Redis for the integration tests, the same
    # images as make db and make redis. The PostgreSQL tests create and drop
    # their own databases; the Redis tests use and delete their own keys.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U gateway"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Show Go version
        run: go version

      # The commands live in the Makefile, shared with local development.
      - name: Check formatting
        run: make fmt

      - name: Vet
        run: make vet

      # The PostgreSQL and Redis tests fail rather than skip in CI if these
      # are missing.
      - name: Test
        run: make test
        env:
          GATEWAY_TEST_DATABASE_URL: postgres://gateway:gateway@localhost:5432/gateway?sslmode=disable
          GATEWAY_TEST_REDIS_URL: redis://localhost:6379/0

      # Exercise benchmark fixtures; runner timings are not performance gates.
      - name: Benchmark check
        run: make bench-check
        env:
          GATEWAY_TEST_REDIS_URL: redis://localhost:6379/0

      - name: Build
        run: make build

      # Reports known vulnerabilities, including in the Go standard library,
      # that the code can reach. Pinned for reproducible results.
      - name: Vulnerability check
        run: make vuln

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The docker-container builder can build several platforms at once;
      # the runner's default docker driver cannot.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Both images for amd64 and arm64, cross-compiled without emulation.
      # Nothing is loaded or pushed.
      - name: Build images
        run: make image-check

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      # Lints and renders the chart with its CI values, and checks that
      # invalid values are rejected. No cluster is involved.
      - name: Lint chart
        run: make helm-lint

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      # No backend initialization, credentials, or AWS API calls.
      - name: Check Terraform
        run: make terraform-check

  kind:
    name: Kubernetes (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # kind runs pinned through go run; kubectl is preinstalled.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      # Builds both images, creates the cluster, and starts metrics-server and
      # the disposable PostgreSQL and Redis.
      - name: Start cluster
        run: make kind-up

      # Synthetic Secrets, then the chart with the migration hook, waiting for
      # the pods to become ready.
      - name: Deploy chart
        run: make kind-deploy

      # One authenticated completion per provider from the fake sidecar, and
      # the metrics port. No timing thresholds.
      - name: Check gateway
        run: make kind-check

      - name: Show cluster state
        if: failure()
        run: |
          kubectl --context kind-llm-gateway --namespace llm-gateway get all,events
          kubectl --context kind-llm-gateway --namespace llm-gateway logs --all-containers --prefix \
            --selector app.kubernetes.io/name=llm-gateway --tail 100 || true
