name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A new push to a pull request cancels its outdated run. Runs on main are
# never canceled, so every merge is verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Show Go version
        run: go version

      # The commands live in the Makefile, shared with local development.
      - name: Check formatting
        run: make fmt

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Build
        run: make build

      # Reports known vulnerabilities, including in the Go standard library,
      # that the code can reach. Pinned for reproducible results.
      - name: Vulnerability check
        run: make vuln
