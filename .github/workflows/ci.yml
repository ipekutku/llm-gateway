name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A new push to a pull request cancels its outdated run. Runs on main are
# never canceled, so every merge is verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A disposable PostgreSQL and Redis for the integration tests, the same
    # images as make db and make redis. The PostgreSQL tests create and drop
    # their own databases; the Redis tests use and delete their own keys.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U gateway"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Show Go version
        run: go version

      # The commands live in the Makefile, shared with local development.
      - name: Check formatting
        run: make fmt

      - name: Vet
        run: make vet

      # The PostgreSQL and Redis tests fail rather than skip in CI if these
      # are missing.
      - name: Test
        run: make test
        env:
          GATEWAY_TEST_DATABASE_URL: postgres://gateway:gateway@localhost:5432/gateway?sslmode=disable
          GATEWAY_TEST_REDIS_URL: redis://localhost:6379/0

      - name: Build
        run: make build

      # Reports known vulnerabilities, including in the Go standard library,
      # that the code can reach. Pinned for reproducible results.
      - name: Vulnerability check
        run: make vuln
