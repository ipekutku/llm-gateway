apiVersion: 1

# Traces are viewed in Jaeger's own UI: Jaeger 2.22 serves only its v3 API,
# which Grafana's Jaeger data source does not use.

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s
