# Local observability stack for a gateway running on the host with
# `go run ./cmd/gateway`. Start it with `make observability`; see the README.
# Every port is published on loopback only, and Grafana needs no login, so
# this stack is for local development, not for exposure. The Makefile sets
# the published ports; each can be overridden, as in
# `make observability PROMETHEUS_PORT=19090`.
name: llm-gateway-observability

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    # Reaches the gateway's metrics listener on the host. Docker Desktop
    # provides host.docker.internal itself; on Linux this maps it.
    extra_hosts:
      - host.docker.internal:host-gateway

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - 127.0.0.1:${JAEGER_UI_PORT:-16686}:16686 # UI
      - 127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318 # OTLP over HTTP, the gateway's OTEL_EXPORTER_OTLP_ENDPOINT

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/llm-gateway.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3000}:3000
    depends_on:
      - prometheus
