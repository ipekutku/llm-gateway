# External Secrets for the gateway on EKS (make aws-deploy). They turn the
# platform's Secrets Manager entries into exactly the Kubernetes Secrets the
# chart expects, so the chart needs nothing AWS-specific. The operator reads
# Secrets Manager with its own Pod Identity role; the gateway pods have no AWS
# permissions. deploy/aws/deploy.sh replaces the placeholders, the names in
# double underscores, with Terraform outputs, none of them secret.
#
# The secrets are read again every hour, but the gateway reads them only at
# startup: restart the Deployment after changing a value.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-north-1
---
# The RDS master user, which owns the schema: used by the migration hook (url)
# and by psql in the database role Job and the usage check (the other keys),
# never by the gateway pods. The password is a URL query parameter, where
# urlquery's encoding is exact; RDS passwords contain no spaces.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-gateway-database-owner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: llm-gateway-database-owner
    template:
      engineVersion: v2
      data:
        url: "postgres://{{ .username | urlquery }}@__DATABASE_HOST__:5432/__DATABASE_NAME__?sslmode=verify-full&sslrootcert=/etc/llm-gateway/database-ca/ca.pem&password={{ .password | urlquery }}"
        host: __DATABASE_HOST__
        database: __DATABASE_NAME__
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: __DATABASE_SECRET_ARN__
        property: username
    - secretKey: password
      remoteRef:
        key: __DATABASE_SECRET_ARN__
        property: password
---
# The gateway's own role, gateway_app, which may only read and insert rows
# (see database-role.yaml). The Job creating the role reads the password key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-gateway-database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: llm-gateway-database
    template:
      engineVersion: v2
      data:
        url: "postgres://gateway_app@__DATABASE_HOST__:5432/__DATABASE_NAME__?sslmode=verify-full&sslrootcert=/etc/llm-gateway/database-ca/ca.pem&password={{ .password | urlquery }}"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: llm-gateway/database-app-password
---
# TLS (rediss://) with the AUTH token as the password of the default user.
# Amazon's public CAs sign the certificate, so no CA bundle is needed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-gateway-redis
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: llm-gateway-redis
    template:
      engineVersion: v2
      data:
        url: "rediss://:{{ .token | urlquery }}@__REDIS_HOST__:6379/0"
  data:
    - secretKey: token
      remoteRef:
        key: llm-gateway/redis-auth-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-gateway-clients
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: llm-gateway-clients
  data:
    - secretKey: clients.json
      remoteRef:
        key: llm-gateway/clients
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-gateway-openai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: llm-gateway-openai
  data:
    - secretKey: api-key
      remoteRef:
        key: llm-gateway/openai-api-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-gateway-anthropic
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: llm-gateway-anthropic
  data:
    - secretKey: api-key
      remoteRef:
        key: llm-gateway/anthropic-api-key
