# ClusterIP only: the gateway serves plain HTTP, and the metrics port is
# unauthenticated. Expose the API outside the cluster only through something
# that terminates TLS.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-gateway.fullname" . }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "llm-gateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
